name: Afula Prices Sync

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync-afula-prices:
    runs-on: ubuntu-22.04 # משתמשים בגרסת לינוקס יציבה ומוגדרת מראש

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install israeli-prices

      - name: Run price fetcher script
        run: |
          python -c "import israeli_prices; print('Library loaded successfully!')"

      - name: Upload generated price files
        uses: actions/upload-artifact@v4
        with:
          name: afula-prices-json
          path: output/*.json
