name: Afula Prices Sync

# מתי התהליך רץ?
on:
  schedule:
    - cron: '0 3 * * *' # רץ אוטומטית כל יום שלישי לפנות בוקר (03:00)
  workflow_dispatch:      # מאפשר לך ללחוץ על כפתור "Run" ידנית מתי שתרצה בממשק ה־Web

jobs:
  sync-afula-prices:
    runs-on: ubuntu-latest # הרצה על סביבת לינוקס נקייה בענן של GitHub

    steps:
      # 1. משיכת קובץ הפרויקט שלך מתוך ה־Repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. הגדרת סביבת פייתון בגרסה מתאימה
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. התקנת ספריית הקוד הפתוח שמרכזת את הנתונים
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install israeli-prices

      # 4. הרצת סקריפט פייתון ששולף את הסניפים בעפולה ושומר לקובץ
      # (כאן בעתיד נכתוב או נטען את קובץ הפייתון הקטן שרץ על הספרייה)
      - name: Run price fetcher script
        run: |
          python -c "import israeli_prices; print('Library loaded successfully!')"
          # בהמשך נחליף את השורה הזו בסקריפט ששומר את קבצי ה־JSON/SQLite של 10 הסניפים בעפולה

      # 5. שמירת הקבצים שנוצרו כ־Artifact זמין להורדה
      - name: Upload generated price files
        uses: actions/upload-artifact@v3
        with:
          name: afula-prices-json
          path: output/*.json # התיקייה שבה יישמרו קבצי ה־JSON של הסניפים
